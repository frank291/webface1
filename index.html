<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Studio - 创意设计工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #ffffff;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            line-height: 1.2;
        }

        .container {
            width: 90%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: var(--text);
            font-weight: 500;
            font-size: 16px;
            position: relative;
            transition: color 0.3s;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -8px;
            left: 0;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero 区域 - 独特设计 */
        .hero {
            height: 100vh;
            min-height: 700px;
            display: flex;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 24px;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        .hero p {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 40px;
            max-width: 520px;
        }

        .btn-primary {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.4);
            background: var(--primary-dark);
        }

        /* 服务特色区 */
        .services {
            padding: 120px 0;
            background: white;
        }

        .section-title {
            text-align: center;
            font-size: 44px;
            margin-bottom: 80px;
            color: var(--text);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .service-card {
            background: white;
            padding: 48px 32px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
            border: 1px solid var(--gray-200);
        }

        .service-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }

        .service-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            border-radius: 20px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
        }

        .service-card h3 {
            font-size: 26px;
            margin-bottom: 16px;
        }

        .service-card p {
            color: var(--text-light);
            font-size: 16px;
        }

        /* 页脚 */
        footer {
            background: #1e293b;
            color: #cbd5e1;
            padding: 80px 0 40px;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .footer-text {
            max-width: 600px;
            margin: 0 auto 32px;
            color: #94a3b8;
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .hero h1 {
                font-size: 48px;
            }
            .hero p {
                font-size: 18px;
            }
            .nav-links {
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .hero h1 {
                font-size: 42px;
            }
            .section-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">Aurora</div>
                <div class="nav-links">
                    <a href="#home">首页</a>
                    <a href="#services">服务</a>
                    <a href="#works">作品</a>
                    <a href="#about">关于</a>
                    <a href="#contact">联系</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero" id="home">
        <div class="container">
            <div class="hero-content">
                <h1>打造独一无二的数字体验</h1>
                <p>我们是专注品牌视觉与数字产品的创意设计工作室，帮助企业通过精致的设计语言讲述属于自己的故事。</p>
                <a href="#contact" class="btn-primary">开始合作</a>
            </div>
        </div>
    </section>

    <section class="services" id="services">
        <div class="container">
            <h2 class="section-title">我们的专业服务</h2>
            <div class="services-grid">
                <div class="service-card">
                    <div class="service-icon">✦</div>
                    <h3>品牌设计</h3>
                    <p>从视觉识别系统到完整品牌策略，帮助您建立独特而深刻的品牌形象。</p>
                </div>
                <div class="service-card">
                    <div class="service-icon">✦</div>
                    <h3>网页设计</h3>
                    <p>现代、优雅、响应式的网站设计，让您的品牌在数字世界脱颖而出。</p>
                </div>
                <div class="service-card">
                    <div class="service-icon">✦</div>
                    <h3>数字产品</h3>
                    <p>用户体验导向的App与SaaS产品设计，兼具美感与实用性。</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-logo">Aurora</div>
            <p class="footer-text">用心设计每一处细节，创造属于您的独特美学。</p>
            <p>&copy; 2025 Aurora Studio. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
